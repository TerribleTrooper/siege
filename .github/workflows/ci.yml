name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Форматирование
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Статический анализ
        run: go vet ./...

      - name: Тесты
        run: go test ./... -race -count=1

      - name: Сборка под Linux
        run: CGO_ENABLED=0 GOOS=linux go build -trimpath -o /tmp/siege ./cmd/server
