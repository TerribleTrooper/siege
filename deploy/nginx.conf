# Обратный прокси перед «Осадой». Главное отличие от обычного конфига —
# location для /api/, где нельзя буферизовать поток SSE.
#
# Положить в /etc/nginx/sites-available/siege, затем:
#   ln -s /etc/nginx/sites-available/siege /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# TLS проще всего получить через certbot --nginx.

upstream siege_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# Грубое ограничение частоты на уровне прокси: приложение тоже считает,
# но до него лучше не доводить.
limit_req_zone $binary_remote_addr zone=siege_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name siege.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 указываем в listen, а не отдельной директивой: она появилась
    # только в nginx 1.25, а в Ubuntu 24.04 приезжает 1.24.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name siege.example.com;

    ssl_certificate     /etc/letsencrypt/live/siege.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/siege.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 64k;

    # Поток состояний партии: без буферизации и с длинным таймаутом чтения.
    #
    # Важно: префикс именно /api/, а не /api/rooms/. Для location со слешем
    # на конце nginx отвечает 301 на запрос без слеша — и POST /api/rooms,
    # которым создаётся комната, уезжал бы на несуществующий /api/rooms/.
    location /api/ {
        limit_req zone=siege_api burst=20 nodelay;

        proxy_pass http://siege_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        gzip off;                 # gzip ломает построчную отдачу SSE
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;    # соединение живёт всю партию
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://siege_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
